<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <!-- Background circle -->
  <circle cx="100" cy="100" r="95" fill="#009688" stroke="#00695c" stroke-width="2"/>
  
  <!-- Outer ring -->
  <circle cx="100" cy="100" r="85" fill="none" stroke="#61dafb" stroke-width="2" opacity="0.8"/>
  
  <!-- Exchange arrows (left) -->
  <g id="left-arrow">
    <!-- Arrow pointing right -->
    <line x1="35" y1="100" x2="65" y2="100" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <polygon points="70,100 60,95 60,105" fill="white"/>
  </g>
  
  <!-- Exchange arrows (right) -->
  <g id="right-arrow">
    <!-- Arrow pointing left -->
    <line x1="135" y1="100" x2="165" y2="100" stroke="white" stroke-width="3" stroke-linecap="round"/>
    <polygon points="130,100 140,95 140,105" fill="white"/>
  </g>
  
  <!-- Center box 1 -->
  <rect x="75" y="70" width="20" height="35" fill="white" rx="2"/>
  <circle cx="85" cy="77" r="3" fill="#009688"/>
  <circle cx="85" cy="85" r="3" fill="#009688"/>
  <circle cx="85" cy="93" r="3" fill="#009688"/>
  
  <!-- Center box 2 -->
  <rect x="105" y="70" width="20" height="35" fill="white" rx="2"/>
  <circle cx="115" cy="77" r="3" fill="#61dafb"/>
  <circle cx="115" cy="85" r="3" fill="#61dafb"/>
  <circle cx="115" cy="93" r="3" fill="#61dafb"/>
  
  <!-- Bottom text area -->
  <text x="100" y="125" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white" text-anchor="middle">TRUEKEALO</text>
  
  <!-- Decorative elements -->
  <circle cx="35" cy="50" r="4" fill="#61dafb" opacity="0.6"/>
  <circle cx="165" cy="150" r="4" fill="#61dafb" opacity="0.6"/>
  <circle cx="60" cy="155" r="3" fill="#4caf50" opacity="0.7"/>
  <circle cx="140" cy="45" r="3" fill="#4caf50" opacity="0.7"/>
  
  <!-- Subtle grid background -->
  <g opacity="0.1" stroke="white" stroke-width="1">
    <line x1="20" y1="50" x2="50" y2="50"/>
    <line x1="150" y1="150" x2="180" y2="150"/>
    <line x1="50" y1="20" x2="50" y2="50"/>
    <line x1="150" y1="150" x2="150" y2="180"/>
  </g>
</svg>
